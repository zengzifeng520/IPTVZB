<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<title>登录 / 注册 · 光影直播</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%238b5cf6'/><path d='M38 30l30 20-30 20z' fill='white'/></svg>">
<link rel="stylesheet" href="assets/css/app.css?v=20261026e">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16v12H4z"/><path d="m10 9 5 3-5 3z" fill="currentColor" stroke="none"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">光影直播</span>
        <span class="brand-sub">Live TV Index</span>
      </span>
    </a>
    <div class="top-actions">
      <a class="btn" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px">
          <path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>
        </svg>
        <span>返回首页</span>
      </a>
    </div>
  </div>
</header>

<main class="wrap narrow">
  <section class="auth-hero">
    <h1 id="authTitle">登录账号</h1>
    <p id="authSub">体验版可查看 1 个地区的频道，开通后解锁全部地区。</p>
  </section>

  <div class="auth-card">
    <!-- 已登录时显示，方便切换账号或直接退出 -->
    <div class="auth-logged" id="authLogged" hidden>
      <div class="al-avatar" id="alAvatar">光</div>
      <div class="al-body">
        <div class="al-line">
          <b id="alPhone">—</b>
          <span class="pill" id="alPlan">—</span>
        </div>
        <p class="al-tip">你已登录，可直接进入账户；想换账号请先退出。</p>
      </div>
      <div class="al-acts">
        <a class="btn btn-sm" href="account.html">进入账户</a>
        <button class="btn btn-sm btn-danger" id="alLogout" type="button">退出登录</button>
      </div>
    </div>

    <div class="auth-tabs" role="tablist">
      <button class="auth-tab active" data-tab="login" role="tab">登录</button>
      <button class="auth-tab" data-tab="register" role="tab">注册</button>
    </div>

    <!-- 登录 -->
    <form class="auth-form" id="formLogin" autocomplete="on" hidden>
      <label class="field">
        <span class="field-label">手机号</span>
        <input id="loginPhone" type="tel" inputmode="numeric" maxlength="11" placeholder="11 位手机号" autocomplete="username">
      </label>
      <label class="field">
        <span class="field-label">密码</span>
        <input id="loginPwd" type="password" maxlength="32" placeholder="请输入密码" autocomplete="current-password">
      </label>
      <label class="check-row">
        <input type="checkbox" id="rememberMe" checked>
        <span>记住账号密码，下次自动填好</span>
      </label>
      <button type="submit" class="btn btn-primary btn-block">登录</button>
      <p class="auth-note">忘记密码？本站不保存明文密码，无法找回，可换一个手机号重新注册。</p>
    </form>

    <!-- 注册 -->
    <form class="auth-form" id="formRegister" autocomplete="on" hidden>
      <label class="field">
        <span class="field-label">手机号</span>
        <input id="regPhone" type="tel" inputmode="numeric" maxlength="11" placeholder="11 位手机号" autocomplete="username">
      </label>
      <div class="field-row">
        <label class="field">
          <span class="field-label">密码</span>
          <input id="regPwd" type="password" maxlength="32" placeholder="6~32 位" autocomplete="new-password">
        </label>
        <label class="field">
          <span class="field-label">确认密码</span>
          <input id="regPwd2" type="password" maxlength="32" placeholder="再输一次" autocomplete="new-password">
        </label>
      </div>

      <div class="field">
        <span class="field-label">
          选择地区
          <em class="field-hint">体验版只能查看这 1 个地区，注册后不可更改</em>
        </span>
        <div class="region-picker" id="regionPicker">
          <div class="region-picker-loading">正在加载地区…</div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block">注册并进入</button>
      <p class="auth-note">
        请选择你宽带所在的省份 —— 中转服务器通常只在本省运营商网内可达，
        选错会出现「地址无法播放」。
      </p>
    </form>

    <div class="auth-err" id="authErr"></div>
  </div>

  <p class="auth-foot">
    注册即表示同意本站仅提供直播源索引服务，不对源内容负责。
    <a href="index.html">返回首页</a>
  </p>
</main>

<div class="toast" id="toast"></div>

<script src="assets/js/auth.js?v=20261026e"></script>
<script src="assets/js/login.js?v=20261026e"></script>
</body>
</html>

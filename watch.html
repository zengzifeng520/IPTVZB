<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<title>播放 · 光影直播</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%238b5cf6'/><path d='M38 30l30 20-30 20z' fill='white'/></svg>">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16v12H4z"/><path d="m10 9 5 3-5 3z" fill="currentColor" stroke="none"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-name" id="brandName">光影直播</span>
        <span class="brand-sub">Live TV Index</span>
      </span>
    </a>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
      </svg>
      <input id="q" type="search" placeholder="搜索频道" autocomplete="off">
      <kbd>/</kbd>
    </div>
    <div class="top-actions">
      <a class="btn" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6"/>
        </svg>
        <span>返回</span>
      </a>
    </div>
  </div>
</header>

<main class="wrap watch-main">
  <div class="watch-head">
    <div class="watch-title">
      <h1 id="title">加载中…</h1>
      <div class="watch-meta" id="meta"></div>
    </div>
  </div>

  <div class="watch-grid">
    <div>
      <div class="player-shell" id="shell">
        <div class="player-box">
          <video id="video" playsinline muted></video>
          <div class="player-overlay" id="overlay">
            <div class="po-inner">
              <div class="po-spinner" id="spinner"></div>
              <div class="po-title" id="poTitle">正在连接线路</div>
              <div class="po-desc" id="poDesc">首次播放需要缓冲几秒，请稍候</div>
              <div class="po-actions" id="poActions"></div>
            </div>
          </div>
          <div class="player-bar">
            <span class="pb-title" id="pbTitle">—</span>
            <button class="pb-btn" id="btnPip" title="画中画">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="7" height="6" rx="1"/>
              </svg>
            </button>
            <button class="pb-btn" id="btnFull" title="全屏">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div class="panel" style="margin-top:16px">
        <div class="panel-head">
          <h3>播放说明</h3>
          <span class="hint">快捷键：空格播放/暂停 · F 全屏 · M 静音</span>
        </div>
        <div class="player-tips">
          本站播放的是直播源原始地址，<b>画质与稳定性由源站决定</b>。如果当前线路卡顿或黑屏，直接切换右侧其他线路。
          部分线路限制网页播放（跨域限制），可点击「复制地址」用 <code>PotPlayer</code> / <code>VLC</code> / <code>IINA</code> 等本地播放器打开。
        </div>
      </div>
    </div>

    <aside>
      <div class="panel">
        <div class="panel-head">
          <h3>线路列表</h3>
          <span class="hint" id="srcHint">—</span>
        </div>
        <div class="src-list" id="srcList"></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h3>同分类频道</h3>
          <span class="hint" id="relHint"></span>
        </div>
        <div class="related" id="related"></div>
      </div>
    </aside>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="assets/vendor/hls.min.js"></script>
<script src="assets/js/watch.js"></script>
</body>
</html>

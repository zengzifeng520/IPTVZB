<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<title>光影直播 · 中转播放地址</title>
<meta name="description" content="输入 Token 获取中转服务器播放地址，支持 M3U 订阅，适配 PotPlayer / VLC / TiviMate / APTV。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%238b5cf6'/><path d='M38 30l30 20-30 20z' fill='white'/></svg>">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16v12H4z"/><path d="m10 9 5 3-5 3z" fill="currentColor" stroke="none"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-name" id="brandName">光影直播</span>
        <span class="brand-sub">Live TV Index</span>
      </span>
    </a>
    <div class="top-actions">
      <a class="btn" id="repoLink" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.58 2 12.25c0 4.53 2.87 8.37 6.84 9.73.5.1.68-.22.68-.49 0-.24-.01-.87-.01-1.71-2.78.62-3.37-1.37-3.37-1.37-.45-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.89 1.57 2.34 1.12 2.91.85.09-.66.35-1.12.63-1.38-2.22-.26-4.56-1.14-4.56-5.06 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05a9.4 9.4 0 0 1 2.5-.34c.85 0 1.71.12 2.5.34 1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.93-2.35 4.8-4.58 5.05.36.32.68.94.68 1.9 0 1.37-.01 2.48-.01 2.82 0 .27.18.6.69.49A10.03 10.03 0 0 0 22 12.25C22 6.58 17.52 2 12 2Z"/>
        </svg>
        <span>GitHub</span>
      </a>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="hero hero-center">
    <h1>输入 Token，<em>获取播放地址</em></h1>
    <p>系统会把你的 Token 分配到可用的中转服务器，生成专属播放地址与订阅链接。<br>无需配置，粘贴到播放器即可观看。</p>
  </section>

  <section class="token-card">
    <form class="token-form" id="tokenForm" autocomplete="off">
      <div class="token-field">
        <svg class="tf-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <input id="tokenInput" type="text" placeholder="请输入你的 Token，例如 DEMO-2026" spellcheck="false">
        <button type="submit" class="btn btn-primary token-submit">
          获取地址
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px">
            <path d="M5 12h13"/><path d="m12 5 7 7-7 7"/>
          </svg>
        </button>
      </div>
      <div class="token-err" id="tokenErr"></div>
    </form>

    <div class="token-foot">
      <span>还没有 Token？可以先用体验码：</span>
      <button class="token-demo" data-demo="DEMO-2026">DEMO-2026</button>
      <span class="dot">·</span>
      <button class="token-demo" data-demo="ZB-2026-VIP1">ZB-2026-VIP1</button>
    </div>
  </section>

  <div class="stats stats-center" id="stats"></div>

  <section class="preview">
    <div class="section-head">
      <h2>频道预览</h2>
      <span class="sub" id="previewSub"></span>
    </div>
    <div class="grid grid-preview" id="grid"></div>
  </section>
</main>

<footer class="foot">
  <div class="wrap foot-inner">
    <div>
      <p><b>免责声明</b>：本站不存储、不制作、不转播任何视频内容。播放地址由第三方中转服务器提供，本站仅做地址汇聚与可用性检测，版权归原权利人所有。</p>
      <p>如权利人认为内容侵权，请通过仓库 Issue 联系，核实后移除相关索引。</p>
    </div>
    <div style="text-align:right">
      <p>数据更新：<span id="updAt">—</span></p>
      <p>开源地址：<a id="repoFoot" href="#">GitHub</a></p>
    </div>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script src="assets/js/app.js"></script>
</body>
</html>

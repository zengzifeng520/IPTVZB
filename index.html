<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<title>光影直播 · 全网直播源聚合</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%238b5cf6'/><path d='M38 30l30 20-30 20z' fill='white'/></svg>">
<link rel="stylesheet" href="assets/css/app.css">

<body>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16v12H4z"/><path d="m10 9 5 3-5 3z" fill="currentColor" stroke="none"/>

      </span>
    </a>

    <div class="search">

        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>

          <path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 19h16"/>

        <span>订阅</span>

        </svg>
        <span>GitHub</span>
      </a>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>全网直播源，<em>一屏尽览</em></h1>
    <p id="heroDesc">自动抓取公开直播源，逐条检测清晰度与播放速度，只把能用的留给你。</p>
    <div class="stats" id="stats"></div>
  </section>

  <nav class="cats"><div class="cats-inner" id="cats"></div></nav>

  <div class="section-head">
    <h2 id="secTitle">全部频道</h2>
    <span class="sub" id="secSub"></span>
  </div>

  <div class="grid" id="grid"></div>

<footer class="foot">
  <div class="wrap foot-inner">
    <div>
      <p><b>免责声明</b>：本站不存储、不制作、不转播任何视频内容，所有播放地址均来自互联网公开资源，版权归原权利人所有。本站仅提供技术聚合与可用性检测。</p>
      <p>如权利人认为内容侵权，请通过仓库 Issue 联系，我们会在核实后移除相关索引。</p>
    </div>
    <div style="text-align:right">
      <p>数据更新：<span id="updAt">—</span></p>
      <p>开源地址：<a id="repoFoot" href="#">GitHub</a></p>

  </div>
</footer>

<div class="toast" id="toast"></div>

<script src="assets/js/app.js"></script>

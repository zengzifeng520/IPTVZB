<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f3f5">
<title>喜欢作者，请支持一下 · IPTV直播源分发系统</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%236366f1'/><stop offset='1' stop-color='%23ec4899'/></linearGradient></defs><rect width='100' height='100' rx='24' fill='url(%23g)'/><rect x='25' y='29' width='50' height='42' rx='8' fill='%231e1b4b'/><path d='M41 40l22 10-22 10z' fill='white'/></svg>">
<link rel="stylesheet" href="assets/css/app.css?v=20261026an">
<script src="assets/js/theme.js?v=20261026an"></script>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="3.4" y="5" width="17.2" height="14" rx="3.2" fill="rgba(17,24,39,0.88)"/>
          <path d="M10.3 8.6l5.2 3.4-5.2 3.4z" fill="white"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">IPTV直播源分发系统</span>
        <span class="brand-sub">Live TV Index</span>
      </span>
    </a>
    <div class="top-actions">
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="切换主题"></button>
      <a class="btn" href="index.html">频道首页</a>
    </div>
  </div>
</header>

<main class="wrap narrow">

  <!-- 打赏卡片 -->
  <section class="panel donate-panel">
    <div class="donate-head">
      <h1 class="donate-title">赠予作者 <span class="donate-thumb">👍</span></h1>
      <p class="donate-sub">本站播放地址与订阅<b>全部免费</b>，不设付费墙、不用注册。<br>如果觉得好用，欢迎请作者喝杯咖啡，多少都是心意。</p>
    </div>

    <!-- 金额选择（仿微信赞赏） -->
    <div class="donate-amounts" id="donateAmounts">
      <button class="amount" type="button" data-amt="5"><i>¥</i>5</button>
      <button class="amount" type="button" data-amt="20"><i>¥</i>20</button>
      <button class="amount" type="button" data-amt="50"><i>¥</i>50</button>
      <button class="amount" type="button" data-amt="80"><i>¥</i>80</button>
      <button class="amount" type="button" data-amt="100"><i>¥</i>100</button>
      <button class="amount" type="button" data-amt="200"><i>¥</i>200</button>
    </div>
    <button class="donate-other" id="donateOther" type="button">其它金额</button>
    <div class="donate-custom" id="donateCustom" hidden>
      <input class="donate-custom-input" id="customAmt" type="number" min="1" step="1" placeholder="其它金额（元）" autocomplete="off">
      <button class="btn btn-primary btn-sm" id="customOk" type="button">确定</button>
    </div>

    <!-- 二维码（选定金额后显示） -->
    <div class="donate-qr" id="donateQr" hidden>
      <img src="assets/img/wxpay.jpg" alt="微信赞赏码" loading="lazy">
      <p class="donate-qr-tip">微信扫一扫，支付 <b id="donatePayNum">¥20</b> 支持作者 ☕</p>
    </div>

    <p class="donate-thanks">感谢每一位支持的朋友，你的心意是站点持续更新的动力 💪</p>
  </section>

  <!-- 免费订阅地址 -->
  <section class="panel">
    <div class="panel-head">
      <h2>免费订阅地址</h2>
      <span class="pill pill-ok">全部免费</span>
    </div>
    <p class="upgrade-desc">
      粘贴到 PotPlayer / VLC / TiviMate / APTV 的「订阅 / 远程列表」，即可加载全部频道。
      数据每小时自动更新，跨省中转地址大多无法播放，建议优先用你所在地区那份。
    </p>
    <div class="sub-list" id="subList"></div>
  </section>

  <p class="auth-foot">
    <a href="index.html">频道首页</a> ·
    <a href="region.html">浏览频道地址</a> ·
    <a href="hotel.html">酒店源</a>
  </p>
</main>

<div class="toast" id="toast"></div>

<script src="assets/js/auth.js?v=20261026an"></script>
<script src="assets/js/account.js?v=20261026an"></script>
</body>
</html>

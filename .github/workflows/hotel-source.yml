name: Hotel source refresh

# 酒店源（HLS）每天巡检三次：北京 06:00 / 12:00 / 18:00
#   06:00、18:00  全量：重新拉 extract_hotel -> 验活 -> 聚合（能发现新主机，6-8 分钟）
#   12:00        巡检：只复验现有地址，剔除失效（1-2 分钟，不拉全量）
# 和组播采集解耦：组播走 api-harvest / site-data，酒店源只在这里跑，时间固定。

on:
  schedule:
    # UTC 22:00 = 北京次日 06:00（全量）
    - cron: "0 22 * * *"
    # UTC 04:00 = 北京 12:00（巡检）
    - cron: "0 4 * * *"
    # UTC 10:00 = 北京 18:00（全量）
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hotel-source
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore relay pool from state branch
        run: bash scripts/restore_state.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests urllib3

      - name: Harvest hotel sources (full)
        if: github.event.schedule != '0 4 * * *'
        env:
          PYTHONIOENCODING: utf-8
        run: cd spider && timeout 1800 python hotel_pool.py

      - name: Patrol hotel sources (existing only)
        if: github.event.schedule == '0 4 * * *'
        env:
          PYTHONIOENCODING: utf-8
        run: cd spider && timeout 900 python hotel_pool.py --check-only

      - name: Harvest gangaotai sources
        env:
          PYTHONIOENCODING: utf-8
        run: cd spider && python gangaotai_pool.py

      - name: Build international channels
        env:
          PYTHONIOENCODING: utf-8
        # --no-probe：种子已在大陆网络深度体检过，Actions 跑在美国，
        # 地域结论相反，真验活会误杀大陆能通的源
        run: cd spider && python intl_pool.py --no-probe

      - name: Build EPG
        # 生成节目单（国内 615 台 + 港澳台 50 台）。continue-on-error：
        # epg.pw 是境外站，Actions 偶尔拉不到，失败就沿用上一版 EPG，不阻塞整个任务。
        # 只保留 [今天-1, 今天+2] 的节目，所以必须每天重建，否则 4 天后就空了。
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: cd .. && python tools/build_epg.py

      - name: Rebuild subscriptions
        env:
          PYTHONIOENCODING: utf-8
        run: cd spider && python subs.py

      # 酒店源池含全部播放地址，只进 state 分支，不进 main（Pages 会公开 main）
      - name: Push hotel pool to state branch
        run: bash scripts/push_state.sh

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f logos.json data/public data/users.json data/free
          [ -d data/users ] && git add -f data/users || true
          if git diff --staged --quiet; then
            echo "酒店源无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(hotel): 刷新酒店源 $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash -X ours origin main && git push origin HEAD:main; then
              echo "推送成功（第 $i 次尝试）"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "第 $i 次推送失败，5 秒后重试"
            sleep 5
          done
          echo "::error::连续 5 次推送失败"
          exit 1

name: Update proxy data

# 每天探测公网 udpxy 中转服务器 → 汇聚频道地址池 → 生成各 Token 的专属订阅文件。
# 提交后 GitHub Pages 自动重新发布。

on:
  schedule:
    # UTC 19:20 = 北京时间 03:20
    - cron: "20 19 * * *"
  workflow_dispatch:
    inputs:
      skip_probe:
        description: "跳过服务器探测（true 则全部视为存活，仅重新生成）"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: proxy-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests urllib3

      - name: Fetch relays from cqshushu API
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cd spider
          # 通过公开接口采集中转服务器与频道地址；失败不阻断后续流程
          timeout 1800 python shushu_crawl.py || echo "::warning::cqshushu 采集未完成，使用既有数据"

      - name: Probe udpxy servers & build address pool
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cd spider
          if [ "${{ github.event.inputs.skip_probe }}" = "true" ]; then
            python -c "import udpxy; udpxy.main(probe=False)"
          else
            python udpxy.py
          fi

      - name: Generate token subscriptions
        env:
          PYTHONIOENCODING: utf-8
        run: cd spider && python tokens.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/proxy.json data/tokens.json data/sub
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(data): 更新中转地址池 $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash -X ours origin main && git push origin HEAD:main; then
              echo "推送成功（第 $i 次尝试）"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "第 $i 次推送失败，5 秒后重试"
            sleep 5
          done
          echo "::error::连续 5 次推送失败"
          exit 1

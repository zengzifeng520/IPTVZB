name: Update proxy data

# 每天：本地探测 udpxy 存活 → 用存活主机喂解析接口扩充频道清单
#       → 汇聚频道地址池 → 生成各 Token 的专属订阅文件。
# 提交后 GitHub Pages 自动重新发布。

on:
  schedule:
    # UTC 19:20 = 北京时间 03:20
    - cron: "20 19 * * *"
  workflow_dispatch:
    inputs:
      skip_probe:
        description: "跳过服务器探测（true 则全部视为存活，仅重新生成）"
        required: false
        default: "false"
      crawl_source_list:
        description: "同时抓取 cqshushu 的第三方 IP 列表（较慢，默认关闭）"
        required: false
        default: "false"
  # 改了用户表就立刻重建专属订阅，不用等到次日凌晨
  push:
    paths:
      - "data/users.json"

permissions:
  contents: write

concurrency:
  group: proxy-data
  cancel-in-progress: false

jobs:
  update:
    # push 触发时只重建订阅，不做抓取/探测
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests urllib3

      - name: Enrich own servers via cqshushu parse API
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cd spider
          # 先本地探测存活主机（结果写入缓存），再用它们喂解析接口取全量频道
          timeout 2400 python shushu_enrich.py || echo "::warning::解析接口枚举未完成，沿用既有数据"
          python shushu_import.py || true

      - name: Crawl cqshushu source list (optional)
        if: github.event.inputs.crawl_source_list == 'true'
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cd spider
          timeout 2400 python shushu_crawl.py || echo "::warning::cqshushu 列表采集未完成"

      - name: Probe udpxy servers & build address pool
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cd spider
          if [ "${{ github.event.inputs.skip_probe }}" = "true" ]; then
            python -c "import udpxy; udpxy.main(probe=False)"
          else
            python udpxy.py
          fi

      - name: Group servers by region
        env:
          PYTHONIOENCODING: utf-8
        run: cd spider && python regions.py

      - name: Generate subscriptions (all + per region)
        env:
          PYTHONIOENCODING: utf-8
        run: cd spider && python subs.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/proxy.json data/regions.json data/public data/users.json data/free
          # 用户订阅目录可能为空（还没开通任何会员），存在才加
          [ -d data/users ] && git add -f data/users || true
          git add -f spider/data/shushu_ours.json spider/data/proxy_shushu.m3u 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(data): 更新中转地址池 $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash -X ours origin main && git push origin HEAD:main; then
              echo "推送成功（第 $i 次尝试）"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "第 $i 次推送失败，5 秒后重试"
            sleep 5
          done
          echo "::error::连续 5 次推送失败"
          exit 1

  # 用户表（data/users.json）变更后：只重建订阅文件，不重新抓源，约 1 分钟完成
  rebuild-subscriptions:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: rebuild-subs
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild per-user subscriptions
        env:
          PYTHONIOENCODING: utf-8
        run: cd spider && python subs.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/users.json data/public data/free
          [ -d data/users ] && git add -f data/users || true
          if git diff --staged --quiet; then
            echo "订阅无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(sub): 重建用户专属订阅 $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            if git pull --rebase --autostash -X ours origin main && git push origin HEAD:main; then
              echo "推送成功（第 $i 次尝试）"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "第 $i 次推送失败，5 秒后重试"
            sleep 5
          done
          echo "::error::连续 3 次推送失败"
          exit 1

name: Hourly Check

# 每小时巡检 live.m3u / live.txt：探测每条线路，连续 2 次失败才剔除，
# 结果输出到 checked/（独立订阅地址），不改动每日生成的 live.*。
# 失败计数放在 Actions 缓存里，不污染仓库历史。

on:
  schedule:
    - cron: '7 * * * *'   # 每小时第 7 分钟，避开整点的调度高峰
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install aiohttp

    - name: Restore failure counters
      uses: actions/cache/restore@v4
      continue-on-error: true
      with:
        path: checked/state.json
        key: check-state-${{ github.run_id }}
        restore-keys: |
          check-state-

    - name: Probe sources and prune dead entries
      env:
        CHECK_TIMEOUT: '6'
        CHECK_CONCURRENCY: '150'
        CHECK_ATTEMPTS: '2'
        LENIENT_UDPXY: '1'
        MAX_FAILS: '2'
        MIN_ALIVE_RATIO: '0.3'
        PYTHONIOENCODING: 'utf-8'
      run: python check_live.py

    - name: Save failure counters
      if: always()
      uses: actions/cache/save@v4
      continue-on-error: true
      with:
        path: checked/state.json
        key: check-state-${{ github.run_id }}

    - name: Show summary
      if: always()
      run: |
        if [ -f checked/stats.json ]; then
          {
            echo "## 巡检结果"
            echo '```json'
            cat checked/stats.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Commit checked list
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -f checked/live.m3u checked/live.txt
        if git diff --staged --quiet; then
          echo "验证列表无变化，跳过提交"
          exit 0
        fi
        git add -f checked/stats.json
        git commit -m "Hourly check: prune dead sources"

        for attempt in 1 2 3 4 5; do
          if git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main; then
            echo "推送成功（第 $attempt 次尝试）"
            exit 0
          fi
          git rebase --abort 2>/dev/null || true
          echo "第 $attempt 次推送失败，5 秒后重试"
          sleep 5
        done
        echo "::error::连续 5 次推送失败，请手动检查远端 main 状态"
        exit 1

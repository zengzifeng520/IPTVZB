<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<title>频道详情 · 光影直播</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%238b5cf6'/><path d='M38 30l30 20-30 20z' fill='white'/></svg>">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16v12H4z"/><path d="m10 9 5 3-5 3z" fill="currentColor" stroke="none"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-name" id="brandName">光影直播</span>
        <span class="brand-sub">Live TV Index</span>
      </span>
    </a>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
      </svg>
      <input id="q" type="search" placeholder="搜索频道" autocomplete="off">
      <kbd>/</kbd>
    </div>
    <div class="top-actions">
      <a class="btn" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6"/>
        </svg>
        <span>返回</span>
      </a>
    </div>
  </div>
</header>

<main class="wrap" style="padding-top:22px">
  <div class="channel-head">
    <div class="channel-logo" id="chLogo" style="--h:220"></div>
    <div class="channel-info">
      <h1 id="title">加载中…</h1>
      <div class="channel-meta" id="meta"></div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-primary" id="copyAll">复制全部线路</button>
      <a class="btn" id="dlM3u" href="data/playlist.m3u" download>下载订阅</a>
    </div>
  </div>

  <div class="watch-grid">
    <div>
      <div class="panel">
        <div class="panel-head">
          <h3>可用线路</h3>
          <span class="hint" id="lineHint">—</span>
        </div>
        <div class="line-list" id="lineList"></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h3>怎么用这些地址</h3>
        </div>
        <div class="player-tips">
          本站不提供网页播放。点击任意线路的「复制」，把地址粘贴到 <code>PotPlayer</code>、<code>VLC</code>、<code>IINA</code> 等播放器的
          <b>打开网络串流</b>里即可观看；也可以直接用上方的订阅地址，一次性导入全部频道。
          <br><br>
          线路可用性由源站决定，标注的清晰度与速度来自最近一次检测，实际体验可能随时间变化。若某条线路打不开，换下一条即可。
        </div>
      </div>
    </div>

    <aside>
      <div class="panel">
        <div class="panel-head">
          <h3>同分类频道</h3>
          <span class="hint" id="relHint"></span>
        </div>
        <div class="related" id="related"></div>
      </div>
    </aside>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="assets/js/channel.js"></script>
</body>
</html>
